global:
  scrape_interval: 60s

rule_files:
  - /etc/prometheus/sentinel-rules/*.yml

otlp:
  keep_identifying_resource_attributes: true
  promote_resource_attributes:
    - service.instance.id
    - service.name
    - service.namespace
    - service.version
    - service.criticality
    - cloud.availability_zone
    - cloud.region
    - deployment.environment.name
    - k8s.cluster.name
    - k8s.container.name
    - k8s.cronjob.name
    - k8s.daemonset.name
    - k8s.deployment.name
    - k8s.job.name
    - k8s.namespace.name
    - k8s.node.name
    - k8s.pod.name
    - k8s.replicaset.name
    - k8s.statefulset.name
    - container.name
    - host.name
    - postgresql.database.name
    - postgresql.schema.name
    - postgresql.table.name
    - postgresql.index.name
    - kafka.cluster.alias
    - collector.instance.id

storage:
  tsdb:
    out_of_order_time_window: 30m

