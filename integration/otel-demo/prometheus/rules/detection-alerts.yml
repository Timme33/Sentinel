groups:
  - name: sentinel-safety-alerts
    interval: 1m
    rules:
      - alert: SentinelExtremeErrorRatio
        expr: sentinel:service_error_ratio > 0.50
        for: 2m
        labels:
          severity: critical
          sentinel: "true"
          sentinel_signal: error_ratio
          sentinel_method: extreme_threshold
        annotations:
          summary: "{{ $labels.service_name }} has an extreme error ratio"
          description: "The five-minute server error ratio is {{ $value }}."

      - alert: SentinelExtremeP95Latency
        expr: sentinel:service_p95_latency_ms > 5000
        for: 2m
        labels:
          severity: critical
          sentinel: "true"
          sentinel_signal: p95_latency_ms
          sentinel_method: extreme_threshold
        annotations:
          summary: "{{ $labels.service_name }} has extreme p95 latency"
          description: "The five-minute p95 server latency is {{ $value }} ms."

  - name: sentinel-rolling-alerts
    interval: 1m
    rules:
      - alert: SentinelRollingErrorRatio
        expr: |
          (
            sentinel:service_error_ratio
              >
            clamp_min(
              avg_over_time(sentinel:service_error_ratio[1h])
                + 4 * stddev_over_time(sentinel:service_error_ratio[1h]),
              0.05
            )
          )
          and on (service_name)
          count_over_time(sentinel:service_error_ratio[1h]) >= 30
        for: 2m
        labels:
          severity: warning
          sentinel: "true"
          sentinel_signal: error_ratio
          sentinel_method: rolling_mean_stddev
        annotations:
          summary: "{{ $labels.service_name }} error ratio left its rolling baseline"
          description: "The current error ratio is {{ $value }}."

      - alert: SentinelRollingP95Latency
        expr: |
          (
            sentinel:service_p95_latency_ms
              >
            clamp_min(
              avg_over_time(sentinel:service_p95_latency_ms[1h])
                + 4 * stddev_over_time(sentinel:service_p95_latency_ms[1h]),
              1000
            )
          )
          and on (service_name)
          count_over_time(sentinel:service_p95_latency_ms[1h]) >= 30
        for: 2m
        labels:
          severity: warning
          sentinel: "true"
          sentinel_signal: p95_latency_ms
          sentinel_method: rolling_mean_stddev
        annotations:
          summary: "{{ $labels.service_name }} p95 latency left its rolling baseline"
          description: "The current p95 server latency is {{ $value }} ms."

