groups:
  - name: sentinel-red-signals
    interval: 1m
    rules:
      - record: sentinel:service_request_rate
        expr: |
          sum by (service_name) (
            rate(traces_span_metrics_calls_total{
              span_kind="SPAN_KIND_SERVER",
              service_name=~"^(ad|cart|checkout|currency|email|flagd|frontend|frontend-proxy|image-provider|payment|product-catalog|quote|recommendation|shipping)$"
            }[5m])
          )

      - record: sentinel:service_error_ratio
        expr: |
          (
            sum by (service_name) (
              rate(traces_span_metrics_calls_total{
                span_kind="SPAN_KIND_SERVER",
                status_code="STATUS_CODE_ERROR",
                service_name=~"^(ad|cart|checkout|currency|email|flagd|frontend|frontend-proxy|image-provider|payment|product-catalog|quote|recommendation|shipping)$"
              }[5m])
            )
            /
            sum by (service_name) (
              rate(traces_span_metrics_calls_total{
                span_kind="SPAN_KIND_SERVER",
                service_name=~"^(ad|cart|checkout|currency|email|flagd|frontend|frontend-proxy|image-provider|payment|product-catalog|quote|recommendation|shipping)$"
              }[5m])
            )
          )
          or on (service_name)
          (
            0 * sum by (service_name) (
              rate(traces_span_metrics_calls_total{
                span_kind="SPAN_KIND_SERVER",
                service_name=~"^(ad|cart|checkout|currency|email|flagd|frontend|frontend-proxy|image-provider|payment|product-catalog|quote|recommendation|shipping)$"
              }[5m])
            )
          )

      - record: sentinel:service_p95_latency_ms
        expr: |
          histogram_quantile(
            0.95,
            sum by (le, service_name) (
              rate(traces_span_metrics_duration_milliseconds_bucket{
                span_kind="SPAN_KIND_SERVER",
                service_name=~"^(ad|cart|checkout|currency|email|flagd|frontend|frontend-proxy|image-provider|payment|product-catalog|quote|recommendation|shipping)$"
              }[5m])
            )
          )

