services:
  otel-collector:
    command:
      - "--config=/etc/otelcol-config.yml"
      - "--config=/etc/otelcol-config-full.yml"
      - "--config=/etc/otelcol-config-observability.yml"
      - "--config=/etc/otelcol-config-extras.yml"
      - "--config=/etc/otelcol-config-sentinel.yml"
      - "--feature-gates=service.profilesSupport"
    volumes:
      - ../Sentinel/integration/otel-demo/otelcol-sentinel.yml:/etc/otelcol-config-sentinel.yml:ro

  prometheus:
    volumes:
      - ../Sentinel/integration/otel-demo/prometheus/prometheus-config.yaml:/etc/prometheus/prometheus-config.yaml:ro
      - ../Sentinel/integration/otel-demo/prometheus/rules:/etc/prometheus/sentinel-rules:ro

  sentinel:
    build:
      context: ../Sentinel
    image: sentinel-aiops:local
    container_name: sentinel
    command: ["--config", "/etc/sentinel/config.json", "detect"]
    depends_on:
      prometheus:
        condition: service_started
    restart: unless-stopped
    volumes:
      - ../Sentinel/configs/docker.json:/etc/sentinel/config.json:ro
      - sentinel-data:/app/data

  sentinel-investigator:
    image: sentinel-aiops:local
    container_name: sentinel-investigator
    command: ["--config", "/etc/sentinel/config.json", "investigations", "worker"]
    profiles: ["investigation"]
    depends_on:
      jaeger:
        condition: service_started
      opensearch:
        condition: service_healthy
    restart: unless-stopped
    volumes:
      - ../Sentinel/configs/docker.json:/etc/sentinel/config.json:ro
      - sentinel-data:/app/data
      - sentinel-codex-home:/root/.codex

volumes:
  sentinel-data:
  sentinel-codex-home:
