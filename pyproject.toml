[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinel-aiops"
version = "0.1.0"
description = "Prometheus-backed incident detection for distributed systems"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.19,<2",
    "openai-codex",
]

[project.scripts]
sentinel = "sentinel.cli:main"

[tool.setuptools]
package-dir = { sentinel = "src" }
packages = [
    "sentinel",
    "sentinel.detection",
    "sentinel.domain",
    "sentinel.incidents",
    "sentinel.investigation",
    "sentinel.telemetry",
]

[tool.setuptools.package-data]
"sentinel.investigation" = ["prompts/*.md"]
